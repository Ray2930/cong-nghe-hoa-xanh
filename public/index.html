<!doctype html>
<html lang="vi">

        <div class="dd-menu">
          <a href="/san-pham?loai=rua-tay" data-link data-i18n="cat_rua-tay">Nước rửa tay</a>

        <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Tìm sản phẩm…" aria-label="Search">
        <div id="results" class="results" hidden></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="vi" class="on">VIE</button><span>|</span><button data-lang="en">ENG</button>
      </div>
    </div>

<main id="app" tabindex="-1"></main>

    <div>
      <div class="logo foot-logo"><img src="/logo.png" width="40" height="40" alt="" class="logo-img"><span>CÔNG NGHỆ <b>HÓA XANH</b></span></div>
